<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc"><title id="title">Jarvis · logical architecture</title><desc id="desc">A single-user local service coordinating official agent runtimes. Solid: primary interactions and persistence. Dashed: owner decisions and state returned to the interface. Local app state stays on device; real agent tasks use external provider services. Approval behavior varies by runner.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#80909b"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1280" height="620" rx="0" fill="#ffffff" stroke="#ffffff"/><text x="48" y="59" fill="#17212b" font-size="32" font-weight="650" text-anchor="start">Jarvis · logical architecture</text><text x="48" y="94" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">A single-user local service coordinating official agent runtimes.</text><rect x="48" y="160" width="260" height="110" rx="6" fill="#f7f9fa" stroke="#dce2e6"/><text x="68" y="196" fill="#17212b" font-size="23" font-weight="600" text-anchor="start">Web / desktop</text><text x="68" y="225" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">React + Electron shell</text><text x="68" y="250" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Tasks, chat, approvals</text><rect x="388" y="160" width="350" height="110" rx="6" fill="#f7f9fa" stroke="#dce2e6"/><text x="408" y="196" fill="#17212b" font-size="23" font-weight="600" text-anchor="start">Local Hono service</text><text x="408" y="225" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">API, event stream, scheduler</text><text x="408" y="250" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Task routing + memory context</text><rect x="818" y="160" width="410" height="110" rx="6" fill="#f7f9fa" stroke="#dce2e6"/><text x="838" y="196" fill="#17212b" font-size="23" font-weight="600" text-anchor="start">Agent runtimes</text><text x="838" y="225" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Claude Agent SDK / Codex SDK</text><text x="838" y="250" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Authenticated CLI sessions</text><rect x="388" y="370" width="350" height="110" rx="6" fill="#f7f9fa" stroke="#dce2e6"/><text x="408" y="406" fill="#17212b" font-size="23" font-weight="600" text-anchor="start">SQLite + run artifacts</text><text x="408" y="435" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Tasks, events, usage, settings</text><text x="408" y="460" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Local application state</text><rect x="818" y="370" width="410" height="110" rx="6" fill="#f7f9fa" stroke="#dce2e6"/><text x="838" y="406" fill="#17212b" font-size="23" font-weight="600" text-anchor="start">Projects + Markdown vault</text><text x="838" y="435" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Task worktrees and local files</text><text x="838" y="460" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Memory reads / proposed edits</text><rect x="48" y="370" width="260" height="110" rx="6" fill="#f7f9fa" stroke="#dce2e6"/><text x="68" y="406" fill="#17212b" font-size="23" font-weight="600" text-anchor="start">Owner decisions</text><text x="68" y="435" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Runner-specific policy</text><text x="68" y="460" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Review requested actions</text><path d="M308,215 L388,215" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M738,215 L818,215" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M563,270 L563,370" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1023,270 L1023,370" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M178,370 L178,310 L425,310 L425,270" fill="none" stroke="#80909b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M425,160 L425,125 L270,125 L270,160" fill="none" stroke="#80909b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="48" y="542" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Solid: primary interactions and persistence. Dashed: owner decisions and state returned to the interface.</text><text x="48" y="569" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Local app state stays on device; real agent tasks use external provider services. Approval behavior varies by runner.</text></g></svg>