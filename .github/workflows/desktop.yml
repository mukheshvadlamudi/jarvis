name: Desktop app

# Builds the Jarvis desktop installers on real Windows, macOS and Linux machines.
# Builds are paused on ordinary pushes: test locally first, then start one on purpose.
# - Actions → Desktop app → Run workflow (or: gh workflow run desktop.yml -f platforms=win):
#   installers are attached to the run as downloadable artifacts. Windows only unless you pick "all".
# - Push a tag like v0.2.0: all three platforms, also published as a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build (macOS minutes count 10x on private repos)
        type: choice
        options: [win, all]
        default: win

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platforms == 'win' && '[{"os":"windows-latest","target":"win","arch":"x64"}]' || '[{"os":"windows-latest","target":"win","arch":"x64"},{"os":"macos-latest","target":"mac","arch":"arm64"},{"os":"ubuntu-latest","target":"linux","arch":"x64"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      JARVIS_RUNNER: mock
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck and test (mock runner only)
        run: |
          npm run typecheck
          npm test
      - name: Package
        run: node scripts/package-desktop.mjs ${{ matrix.target }} --arch=${{ matrix.arch }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.AppImage
            dist-desktop/*.deb
          if-no-files-found: error
          retention-days: 3
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.AppImage
            dist-desktop/*.deb
