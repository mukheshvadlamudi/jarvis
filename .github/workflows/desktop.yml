name: Desktop app

# Builds the Jarvis desktop installers on real Windows, macOS and Linux machines.
# - Any push that touches the app: installers are attached to the run as downloadable artifacts.
# - Push a tag like v0.2.0: installers are also published as a GitHub Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'server/**'
      - 'web/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-latest
            target: mac
            arch: arm64
          - os: ubuntu-latest
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      JARVIS_RUNNER: mock
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck and test (mock runner only)
        run: |
          npm run typecheck
          npm test
      - name: Package
        run: node scripts/package-desktop.mjs ${{ matrix.target }} --arch=${{ matrix.arch }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.AppImage
            dist-desktop/*.deb
          if-no-files-found: error
          retention-days: 30
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.AppImage
            dist-desktop/*.deb
